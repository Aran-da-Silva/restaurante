<!DOCTYPE html>
<html lang="PT-br>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formu.css">
    <title>formulario</title>
</head>
<body>
    <section id="formulario">
        <h2>Quer um emprego?</h2>
        <p>Preencha os campos abaixo para enviar sua dúvida, sugestão ou feedback.</p>
        <p><span class="destaque">Atenção:</span>preencha todas as perguntas</p>
        <form>
            <div class="campo-formulario">
                <label for="nome">Seu nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
            </div>

            <div class="campo-formulario">
                <label for="email">Seu email</label>
                <input type="text" id="email" name="email" placeholder="exemplo@gmail.com">
            </div>

            <div class="campo-formulario">
                <label for="assunto">Assunto</label>
                <select name="assunto" id="assunto">
                    <option value="sugestão">sugestão de comida</option>
                    <option value="duvida">dúvida</option>
                    <option value="feedback">feedback</option>
                    <option value="parceria">parceria</option>
                </select>
            </div>

            <div class="campo-formulario">
                <label for="mensagem">mensagem</label>
                <textarea name="mensagem" id="mensagem" placeholder="digite sua mensagem"></textarea>
            

            </div>
            <button type="submit">Enviar mensagem</button>
        </form>
    </section>
</body>
</html>
